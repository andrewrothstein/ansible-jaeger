---
- name: Testing andrewrothstein.jaeger
  hosts: all
  roles:
    - role: '{{ playbook_dir }}'
  tasks:
    - name: Executing 'jaeger-all-in-one version'
      ansible.builtin.command: jaeger-all-in-one version
      changed_when: false
      register: jaegar_test_output
    - name: Output from 'jaeger-all-in-one version'
      ansible.builtin.debug:
        msg: '{{ jaegar_test_output.stdout }}'
